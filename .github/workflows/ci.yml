name: Build and test
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.401'
      - run: dotnet restore FamilyTree.sln --locked-mode
      - run: dotnet build FamilyTree.sln -c Release --no-restore
      - run: dotnet test tests/FamilyTree.Tests -c Release --no-build --no-restore --logger trx --results-directory TestResults
      - name: Package Windows desktop application
        if: runner.os == 'Windows'
        run: dotnet publish src/FamilyTree.UI -c Release -r win-x64 --self-contained true -p:RestoreLockedMode=true -o artifacts/win-x64
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: FamilyTree-win-x64
          path: artifacts/win-x64/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults/
